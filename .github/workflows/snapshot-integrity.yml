name: STAMP snapshot integrity
on:
  push:
    paths:
      - 'data/latest.json'
      - 'scripts/check_latest_snapshot.py'
      - '.github/workflows/snapshot-integrity.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check latest snapshot structure and market identity
        run: python scripts/check_latest_snapshot.py
