name: STAMP Dashboard UI Validation
on:
  push:
    branches: [main]
    paths:
      - 'src/build_dashboard.py'
      - 'src/private_dashboard.py'
      - 'dashboard/private.html'
      - 'dashboard/private.css'
      - 'dashboard/private.js'
      - '.github/workflows/dashboard-ui.yml'
  workflow_dispatch:
jobs:
  render-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate authenticated app scripts and backend imports
        run: |
          node --check dashboard/private.js
          node --check dashboard/market-stream.js
          python -m py_compile src/private_dashboard.py src/build_dashboard.py
          python - <<'PY'
          from pathlib import Path
          markup=Path("dashboard/private.html").read_text()
          script=Path("dashboard/private.js").read_text()
          backend=Path("src/private_dashboard.py").read_text()
          for identity in ("forecastCards","labStatus","labProposals","labEvaluated","labRecentDecisions"):
              assert 'id="'+identity+'"' in markup, identity
          assert "renderIntelligence()" in script
          assert 'payload["laboratory"]' in backend
          assert '"lab_decisions.json"' in backend
          print("Authenticated dashboard data bindings: PASS")
          PY
      - name: Build dashboard HTML from repository evidence
        run: python src/build_dashboard.py
      - name: Validate rendered dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          page=Path('dashboard/index.html').read_text()
          for section in ('STAMP Overview','Research forecasts','Autonomous AI Laboratory','Pipeline health','STALE SNAPSHOT'):
              if section not in page and section!='STALE SNAPSHOT':
                  raise AssertionError('Missing UI section: '+section)
          assert '<meta name="viewport"' in page
          assert page.count('class="forecast"')==4, 'four model horizons expected'
          assert 'experimental' in page.lower() or 'RESEARCH' in page, 'evidence label required'
          print('Dashboard markup validated:',len(page),'bytes')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: stamp-dashboard-ui-preview
          path: dashboard/index.html
          retention-days: 14
