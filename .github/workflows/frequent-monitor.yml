name: STAMP frequent monitoring
on:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/frequent-monitor.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stamp-monitor-write
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run deterministic pipeline tests
        id: tests
        run: python -m unittest discover -s tests -v
      - name: Acquire snapshot and analyze
        id: monitor
        run: python scripts/trace_stage.py monitor python src/monitor.py
      - name: Archive completed candles before evaluating forecast outcomes
        id: archive
        run: python scripts/trace_stage.py archive python src/research_engine.py
      - name: Collect synchronized market correlations and finalized on-chain evidence
        id: evidence
        run: python scripts/trace_stage.py evidence python src/evidence_sources.py
      - name: Retrain all research horizons before issuing forecasts
        id: research
        run: python scripts/trace_stage.py research python src/autonomous_research.py
      - name: Evaluate due predictions using time-aligned historical candles, then journal next forecast
        id: audit
        run: python scripts/trace_stage.py audit python src/forecast_audit.py
      - name: Rebuild scorecard after new forecast outcomes
        run: python -c "import sys; sys.path.insert(0,'src'); from research_engine import score; print(score())"
      - name: Reassess automatic model approval after newly matured outcomes
        id: governance
        run: python scripts/trace_stage.py governance python src/model_governor.py
      - name: Diagnose model error against baselines and later time windows
        id: diagnosis
        run: python scripts/trace_stage.py diagnosis python src/model_diagnosis.py --source-commit "$GITHUB_SHA" --output data/model_diagnosis.json
      - name: Verify matured multi-asset predictions and record fresh forecasts
        id: multi_asset_governance
        run: python scripts/trace_stage.py multi_asset_governance python src/multi_asset_governor.py
      - name: Verify forecast issuance and market freshness
        id: forecast_health
        run: python scripts/trace_stage.py forecast_health python src/forecast_health.py
      - name: Verify production HTTP endpoints
        id: production_smoke
        continue-on-error: true
        run: python scripts/trace_stage.py production_smoke python scripts/smoke_production.py
      - name: Build research dashboard
        id: dashboard
        if: always()
        run: python scripts/trace_stage.py dashboard python src/build_dashboard.py
      - name: Commit data and health status
        id: persist
        # A PR checkout may be detached and its token read-only. Never push generated data from PRs.
        # Only scheduled, main-branch pushes and manual runs can write generated artifacts.
        if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name 'stamp-monitor[bot]'
          git config user.email 'stamp-monitor[bot]@users.noreply.github.com'
          mkdir -p data
          python - <<'PY'
          import json,os,datetime,pathlib
          steps={'tests':'${{ steps.tests.outcome }}','monitor':'${{ steps.monitor.outcome }}','audit':'${{ steps.audit.outcome }}','archive':'${{ steps.archive.outcome }}','forecast_health':'${{ steps.forecast_health.outcome }}','research':'${{ steps.research.outcome }}','governance':'${{ steps.governance.outcome }}','evidence':'${{ steps.evidence.outcome }}','diagnosis':'${{ steps.diagnosis.outcome }}','dashboard':'${{ steps.dashboard.outcome }}','multi_asset_governance':'${{ steps.multi_asset_governance.outcome }}'}
          production_smoke='${{ steps.production_smoke.outcome }}'
          record={'timestamp_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'event_name':os.environ.get('GITHUB_EVENT_NAME'),'run_id':os.environ.get('GITHUB_RUN_ID'),'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),'steps':steps,'pipeline_passed':all(v=='success' for v in steps.values()) and production_smoke=='success','production_smoke_passed':production_smoke=='success','production_smoke_outcome':production_smoke}
          trace=pathlib.Path(os.environ["RUNNER_TEMP"])/"stamp-stage-trace.jsonl"
          record["trace"]=[json.loads(line) for line in trace.read_text().splitlines()] if trace.exists() else []
          pathlib.Path('data/workflow_health.json').write_text(json.dumps(record,indent=2))
          print('WORKFLOW HEALTH:',json.dumps(record))
          PY
          python src/operations.py
          python src/build_dashboard.py
          python src/build_offline_dashboard.py
          date -u +'%Y-%m-%dT%H:%M:%SZ' > data/last_workflow_attempt_utc.txt
          # Every completed research run must reach the hosted snapshot. Market
          # streaming is independent; this keeps issued forecasts and outcomes current.
          this_hour="$(date -u +'%Y-%m-%dT%H:00:00Z')"
          python src/build_deployment_snapshot.py
          echo "$this_hour" > data/vercel_heartbeat_utc.txt
          if [ -f data/latest.json ]; then
            python -c 'import json,datetime,pathlib; d=json.loads(pathlib.Path("data/latest.json").read_text()); print("Latest source timestamp:",d.get("raw",{}).get("collected_at_utc"))'
          fi
          git add data/last_workflow_attempt_utc.txt data/vercel_heartbeat_utc.txt src/deployment_snapshot.py
          if [ -f data/production_smoke.json ]; then git add data/production_smoke.json; fi
          if [ -f dashboard/index.html ]; then git add dashboard/index.html; fi
          if [ -f dashboard/private-offline.html ]; then git add dashboard/private-offline.html; fi
          if [ -d data/candles ]; then git add data/candles/; fi
          if [ -d data/context_candles ]; then git add data/context_candles/; fi
          for path in data/latest.json data/observations.jsonl data/forecast_journal.jsonl data/candle_quality.json data/forecast_scorecard.json data/forecast_activity.json data/learning_controller.json data/workflow_health.json data/operations.json data/evidence_sources.json data/onchain_history.jsonl data/verified_burns.jsonl data/news_journal.jsonl data/model_registry.json data/model_decisions.jsonl data/model_diagnosis.json data/model_input_events.jsonl data/model_input_migration.json data/multi_asset_forecasts.json; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "data: scheduled STAMP market observation [skip render]"
            pushed=0
            for attempt in 1 5; do
              # During rebase, 'theirs' is this newly generated data commit.
              # All files in this commit are generated artifacts, never source code.
              echo "PERSIST attempt=$attempt ref=$GITHUB_REF event=$GITHUB_EVENT_NAME branch=$(git branch --show-current) sha=$(git rev-parse --short HEAD)"
              if git fetch origin main && git -c rebase.autoStash=true rebase -X theirs origin/main && git push origin HEAD:main; then
                pushed=1
                break
              fi
              echo "PERSIST retry: current branch and remote state" >&2
              git status --short --branch >&2 || true
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo 'ERROR: Monitoring data was not pushed to GitHub' >&2
              exit 1
            fi
          fi

      - name: Archive private dashboard download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stamp-private-dashboard
          path: dashboard/private-offline.html
          retention-days: 7
          if-no-files-found: warn


      - name: Enforce final end-to-end health gate
        if: always() && github.event_name != 'pull_request'
        env:
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
        run: |
          python - <<'PY'
          import json,pathlib,sys
          p=pathlib.Path("data/workflow_health.json")
          if not p.exists():
              print("FAIL: workflow health file missing",file=sys.stderr)
              sys.exit(1)
          record=json.loads(p.read_text())
          expected=str(__import__("os").environ["GITHUB_RUN_ID"])
          if __import__("os").environ.get("PERSIST_OUTCOME")!="success":
              print("FAIL: generated data and health status were not persisted",file=sys.stderr)
              sys.exit(1)
          if record.get("run_id")!=expected:
              print("FAIL: workflow health belongs to a different run",file=sys.stderr)
              sys.exit(1)
          if record.get("pipeline_passed") is not True or record.get("production_smoke_passed") is not True:
              print("FAIL: end-to-end pipeline or production smoke is not verified",file=sys.stderr)
              print(json.dumps(record,ensure_ascii=False))
              sys.exit(1)
          print("PASS: complete end-to-end pipeline and production smoke",expected)
          PY
