name: STAMP frequent monitoring
on:
  push:
    branches: [main]
    paths:
      - 'src/monitor.py'
      - 'src/model.py'
      - 'src/forecast_audit.py'
      - 'src/market_features.py'
      - 'src/candlestick_features.py'
      - 'src/research_engine.py'
      - 'src/adaptive_feedback.py'
      - 'src/autonomous_research.py'
      - 'src/tradingview_features.py'
      - 'src/build_dashboard.py'
      - 'src/private_dashboard.py'
      - 'api/**'
      - 'vercel.json'
      - 'src/build_offline_dashboard.py'
      - 'src/build_deployment_snapshot.py'
      - 'dashboard/private.*'
      - 'src/pine_parity.py'
      - 'tradingview/**'
      - 'tests/**'
      - '.github/workflows/frequent-monitor.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stamp-monitor-write
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run deterministic pipeline tests
        id: tests
        run: python -m unittest discover -s tests -v
      - name: Acquire snapshot and analyze
        id: monitor
        run: python src/monitor.py
      - name: Evaluate past predictions and journal new validated forecasts
        id: audit
        run: python src/forecast_audit.py
      - name: Archive candles and evaluate model skill
        id: archive
        run: python src/research_engine.py
      - name: Autonomous research and model competition
        id: research
        run: python src/autonomous_research.py
      - name: Build research dashboard
        id: dashboard
        if: always()
        run: python src/build_dashboard.py
      - name: Commit data and health status
        if: always()
        run: |
          git config user.name 'stamp-monitor[bot]'
          git config user.email 'stamp-monitor[bot]@users.noreply.github.com'
          mkdir -p data
          python - <<'PY'
          import json,os,datetime,pathlib
          steps={'tests':'${{ steps.tests.outcome }}','monitor':'${{ steps.monitor.outcome }}','audit':'${{ steps.audit.outcome }}','archive':'${{ steps.archive.outcome }}','research':'${{ steps.research.outcome }}','dashboard':'${{ steps.dashboard.outcome }}'}
          record={'timestamp_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'event_name':os.environ.get('GITHUB_EVENT_NAME'),'run_id':os.environ.get('GITHUB_RUN_ID'),'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),'steps':steps,'pipeline_passed':all(v=='success' for v in steps.values())}
          pathlib.Path('data/workflow_health.json').write_text(json.dumps(record,indent=2))
          print('WORKFLOW HEALTH:',json.dumps(record))
          PY
          python src/build_dashboard.py
          python src/build_offline_dashboard.py
          date -u +'%Y-%m-%dT%H:%M:%SZ' > data/last_workflow_attempt_utc.txt
          # One change per UTC hour triggers an authenticated Vercel snapshot deployment
          # without storing a private GitHub token in the hosted application.
          this_hour="$(date -u +'%Y-%m-%dT%H:00:00Z')"
          if [ ! -f data/vercel_heartbeat_utc.txt ] || [ "$(cat data/vercel_heartbeat_utc.txt)" != "$this_hour" ]; then
            python src/build_deployment_snapshot.py
          fi
          printf '%s\\n' "$this_hour" > data/vercel_heartbeat_utc.txt
          if [ -f data/latest.json ]; then
            python -c 'import json,datetime,pathlib; d=json.loads(pathlib.Path("data/latest.json").read_text()); print("Latest source timestamp:",d.get("raw",{}).get("collected_at_utc"))'
          fi
          git add data/last_workflow_attempt_utc.txt data/vercel_heartbeat_utc.txt src/deployment_snapshot.py
          if [ -f dashboard/index.html ]; then git add dashboard/index.html; fi
          if [ -f dashboard/private-offline.html ]; then git add dashboard/private-offline.html; fi
          if [ -d data/candles ]; then git add data/candles/; fi
          for path in data/latest.json data/observations.jsonl data/forecast_journal.jsonl data/candle_quality.json data/forecast_scorecard.json data/learning_controller.json data/workflow_health.json; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "data: scheduled STAMP market observation"
            pushed=0
            for attempt in 1 2 3; do
              if git pull --rebase && git push; then
                pushed=1
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo 'ERROR: Monitoring data was not pushed to GitHub' >&2
              exit 1
            fi
          fi

      - name: Archive private dashboard download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stamp-private-dashboard
          path: dashboard/private-offline.html
          retention-days: 7
          if-no-files-found: warn
