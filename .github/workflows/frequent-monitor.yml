name: STAMP frequent monitoring
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/frequent-monitor.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: stamp-monitor-write
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run deterministic pipeline tests
        id: tests
        run: python -m unittest discover -s tests -v
      - name: Acquire snapshot and analyze
        id: monitor
        run: python src/monitor.py
      - name: Archive completed candles before evaluating forecast outcomes
        id: archive
        run: python src/research_engine.py
      - name: Collect synchronized market correlations and finalized on-chain evidence
        id: evidence
        run: python src/evidence_sources.py
      - name: Retrain all research horizons before issuing forecasts
        id: research
        run: python src/autonomous_research.py
      - name: Evaluate due predictions using time-aligned historical candles, then journal next forecast
        id: audit
        run: python src/forecast_audit.py
      - name: Rebuild scorecard after new forecast outcomes
        run: python -c "import sys; sys.path.insert(0,'src'); from research_engine import score; print(score())"
      - name: Reassess automatic model approval after newly matured outcomes
        id: governance
        run: python src/model_governor.py
      - name: Verify forecast issuance and market freshness
        id: forecast_health
        run: python src/forecast_health.py
      - name: Verify production HTTP endpoints
        id: production_smoke
        continue-on-error: true
        run: python scripts/smoke_production.py
      - name: Build research dashboard
        id: dashboard
        if: always()
        run: python src/build_dashboard.py
      - name: Commit data and health status
        # The shared concurrency group serializes push, schedule and manual runs.
        # Persist the first complete run after a code update as well.
        if: always()
        run: |
          git config user.name 'stamp-monitor[bot]'
          git config user.email 'stamp-monitor[bot]@users.noreply.github.com'
          mkdir -p data
          python - <<'PY'
          import json,os,datetime,pathlib
          steps={'tests':'${{ steps.tests.outcome }}','monitor':'${{ steps.monitor.outcome }}','audit':'${{ steps.audit.outcome }}','archive':'${{ steps.archive.outcome }}','forecast_health':'${{ steps.forecast_health.outcome }}','research':'${{ steps.research.outcome }}','governance':'${{ steps.governance.outcome }}','evidence':'${{ steps.evidence.outcome }}','dashboard':'${{ steps.dashboard.outcome }}'}
          production_smoke='${{ steps.production_smoke.outcome }}'
          record={'timestamp_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'event_name':os.environ.get('GITHUB_EVENT_NAME'),'run_id':os.environ.get('GITHUB_RUN_ID'),'run_attempt':os.environ.get('GITHUB_RUN_ATTEMPT'),'steps':steps,'pipeline_passed':all(v=='success' for v in steps.values()),'production_smoke_passed':production_smoke=='success','production_smoke_outcome':production_smoke}
          pathlib.Path('data/workflow_health.json').write_text(json.dumps(record,indent=2))
          print('WORKFLOW HEALTH:',json.dumps(record))
          PY
          python src/build_dashboard.py
          python src/build_offline_dashboard.py
          date -u +'%Y-%m-%dT%H:%M:%SZ' > data/last_workflow_attempt_utc.txt
          # One change per UTC hour triggers an authenticated Vercel snapshot deployment
          # without storing a private GitHub token in the hosted application.
          this_hour="$(date -u +'%Y-%m-%dT%H:00:00Z')"
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ ! -f data/vercel_heartbeat_utc.txt ] || [ "$(cat data/vercel_heartbeat_utc.txt)" != "$this_hour" ] || grep -q 'COMPRESSED_JSON = ""' src/deployment_snapshot.py; then
            python src/build_deployment_snapshot.py
          fi
          echo "$this_hour" > data/vercel_heartbeat_utc.txt
          if [ -f data/latest.json ]; then
            python -c 'import json,datetime,pathlib; d=json.loads(pathlib.Path("data/latest.json").read_text()); print("Latest source timestamp:",d.get("raw",{}).get("collected_at_utc"))'
          fi
          git add data/last_workflow_attempt_utc.txt data/vercel_heartbeat_utc.txt src/deployment_snapshot.py
          if [ -f data/production_smoke.json ]; then git add data/production_smoke.json; fi
          if [ -f dashboard/index.html ]; then git add dashboard/index.html; fi
          if [ -f dashboard/private-offline.html ]; then git add dashboard/private-offline.html; fi
          if [ -d data/candles ]; then git add data/candles/; fi
          if [ -d data/context_candles ]; then git add data/context_candles/; fi
          for path in data/latest.json data/observations.jsonl data/forecast_journal.jsonl data/candle_quality.json data/forecast_scorecard.json data/forecast_activity.json data/learning_controller.json data/workflow_health.json data/evidence_sources.json data/onchain_history.jsonl data/verified_burns.jsonl data/news_journal.jsonl data/model_registry.json data/model_decisions.jsonl; do
            if [ -f "$path" ]; then git add "$path"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "data: scheduled STAMP market observation"
            pushed=0
            for attempt in 1 2 3; do
              # During rebase, 'theirs' is this newly generated data commit.
              # All files in this commit are generated artifacts, never source code.
              if git pull --rebase -X theirs && git push; then
                pushed=1
                break
              fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo 'ERROR: Monitoring data was not pushed to GitHub' >&2
              exit 1
            fi
          fi

      - name: Archive private dashboard download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stamp-private-dashboard
          path: dashboard/private-offline.html
          retention-days: 7
          if-no-files-found: warn

