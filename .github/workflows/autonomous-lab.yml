name: Autonomous Lab Integrity
on:
  pull_request:
    paths:
      - "src/autonomous_lab.py"
      - "src/experiment_generator.py"
      - "src/experiment_evaluator.py"
      - "src/sandbox_governor.py"
      - "tests/test_autonomous_lab.py"
      - "tests/test_experiment_generator.py"
      - "tests/test_experiment_evaluator.py"
      - "tests/test_sandbox_governor.py"
      - ".github/workflows/autonomous-lab.yml"
  push:
    branches: [main]
    paths:
      - "src/autonomous_lab.py"
      - "src/experiment_generator.py"
      - "src/experiment_evaluator.py"
      - "src/sandbox_governor.py"
      - "src/model_diagnosis.py"
      - "tests/test_autonomous_lab.py"
      - "tests/test_experiment_generator.py"
      - "tests/test_experiment_evaluator.py"
      - "tests/test_sandbox_governor.py"
      - ".github/workflows/autonomous-lab.yml"
  workflow_run:
    workflows: ["STAMP frequent monitoring"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "12 * * * *"
jobs:
  verify:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    concurrency:
      group: stamp-lab-persist-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'refs/heads/main' || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model dependencies
        run: python -m pip install -r requirements.txt
      - name: Test isolated lab
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_autonomous_lab.py' -v
          python -m unittest discover -s tests -p 'test_experiment_generator.py' -v
          python -m unittest discover -s tests -p 'test_experiment_evaluator.py' -v
          python -m unittest discover -s tests -p 'test_sandbox_governor.py' -v
      - name: Run audit against archived data (never promote)
        env:
          PYTHONPATH: src
        run: |
          python src/autonomous_lab.py
          python src/experiment_generator.py --output data/lab_experiments.json
          python src/experiment_evaluator.py --limit 4
          python src/sandbox_governor.py
          python -m json.tool data/autonomous_lab.json > /dev/null
          python -m json.tool data/lab_experiments.json > /dev/null
          python -m json.tool data/lab_evaluations.json > /dev/null
          python -m json.tool data/lab_decisions.json > /dev/null
          python -m json.tool data/lab_history.json > /dev/null
      - name: Publish sandbox proposal artifact
        uses: actions/upload-artifact@v4
        with:
          name: stamp-autonomous-lab-proposals
          path: |
            data/autonomous_lab.json
            data/lab_experiments.json
            data/lab_evaluations.json
            data/lab_decisions.json
            data/lab_history.json
          if-no-files-found: error
          retention-days: 14
      - name: Persist cumulative research and lab dashboard artifacts
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/lab_history.json data/autonomous_lab.json data/lab_experiments.json data/lab_evaluations.json data/lab_decisions.json
          if ! git diff --cached --quiet; then
            git commit -m "data: carry forward autonomous laboratory experiment history [skip ci] [skip render]"
            for i in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep 3
            done
            exit 1
          fi
