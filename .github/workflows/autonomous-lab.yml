name: Autonomous Lab Integrity
on:
  pull_request:
    paths:
      - "src/autonomous_lab.py"
      - "src/experiment_generator.py"
      - "src/experiment_evaluator.py"
      - "src/sandbox_governor.py"
      - "tests/test_autonomous_lab.py"
      - "tests/test_experiment_generator.py"
      - "tests/test_experiment_evaluator.py"
      - "tests/test_sandbox_governor.py"
      - ".github/workflows/autonomous-lab.yml"
  push:
    branches: [main]
    paths:
      - "src/autonomous_lab.py"
      - "src/experiment_generator.py"
      - "src/experiment_evaluator.py"
      - "src/sandbox_governor.py"
      - "src/model_diagnosis.py"
      - "tests/test_autonomous_lab.py"
      - "tests/test_experiment_generator.py"
      - "tests/test_experiment_evaluator.py"
      - "tests/test_sandbox_governor.py"
      - "src/model_diagnosis.py"
      - ".github/workflows/autonomous-lab.yml"
  workflow_dispatch:
  schedule:
    - cron: "12 * * * *"
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model dependencies
        run: python -m pip install -r requirements.txt
      - name: Test isolated lab
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -p 'test_autonomous_lab.py' -v
          python -m unittest discover -s tests -p 'test_experiment_generator.py' -v
          python -m unittest discover -s tests -p 'test_experiment_evaluator.py' -v
          python -m unittest discover -s tests -p 'test_sandbox_governor.py' -v
      - name: Run audit against archived data (never promote)
        env:
          PYTHONPATH: src
        run: |
          python src/autonomous_lab.py
          python src/experiment_generator.py --output data/lab_experiments.json
          python src/experiment_evaluator.py --limit 4
          python src/sandbox_governor.py
          python -m json.tool data/autonomous_lab.json > /dev/null
      - name: Publish sandbox proposal artifact
        uses: actions/upload-artifact@v4
        with:
          name: stamp-autonomous-lab-proposals
          path: |
            data/autonomous_lab.json
            data/lab_experiments.json
            data/lab_evaluations.json
            data/lab_decisions.json
          if-no-files-found: error
          retention-days: 14
