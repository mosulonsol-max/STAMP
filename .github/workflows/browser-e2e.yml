name: STAMP real browser integration
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'dashboard/private.*'
      - 'dashboard/pipeline-3d.js'
      - 'dashboard/workspace-tabs.js'
      - 'dashboard/market-map.js'
      - 'dashboard/market-stream.js'
      - 'dashboard/technical-overlays.js'
      - 'dashboard/chart-events.js'
      - 'tests/market_stream.cjs'
      - 'scripts/check_market_stream.cjs'
      - 'api/index.py'
      - 'browser-tests/**'
      - '.github/workflows/browser-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python runtime dependencies
        run: pip install -r requirements.txt
      - name: Install Playwright and verify runner Chrome
        run: |
          npm install --no-save @playwright/test@1.56.1
          google-chrome --version
      - name: Verify actual MEXC binary market stream
        run: node scripts/check_market_stream.cjs
      - name: Build the current research snapshot and automatic model decisions
        run: |
          python src/monitor.py
          python src/research_engine.py
          python src/evidence_sources.py
          python src/autonomous_research.py
          python src/forecast_audit.py
          python src/model_governor.py
          python src/build_deployment_snapshot.py
      - name: Start real STAMP application with isolated test credentials
        env:
          DASHBOARD_USER: test-user
          DASHBOARD_PASSWORD: long-test-password
          PORT: '10000'
        run: |
          python src/private_dashboard.py > /tmp/stamp-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:10000/healthz; then exit 0; fi
            sleep 1
          done
          cat /tmp/stamp-server.log
          exit 1
      - name: Verify login and data in real Chromium browser
        env:
          STAMP_CHROME_CHANNEL: chrome
          STAMP_REAL_PAIR_CHECK: '1'
        run: npx playwright test browser-tests --workers=1 --reporter=line
      - name: Upload browser verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stamp-browser-verification
          path: |
            test-results/
            /tmp/stamp-server.log
          retention-days: 3
          if-no-files-found: ignore

